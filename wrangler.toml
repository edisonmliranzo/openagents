name = "openagents"
main = "scripts/cf-worker.mjs"
compatibility_date = "2024-09-23"

# Free tier for the platform-owned key. Off until PLATFORM_LLM_KEY is set.
#
# TRIAL_WINDOW is the spend shape:
#   lifetime -> one-time acquisition cost (default, cheapest)
#   day      -> recurring free tier; cost scales with active users
#   month    -> generous but bounded
#
# TRIAL_MODELS is the hard allow-list: the platform key can only ever call
# these cheap models. Expensive models always require the user's own key.
[vars]
TRIAL_WINDOW = "lifetime"
TRIAL_MESSAGES = "15"
TRIAL_PROVIDER = "apisrouter"
TRIAL_MODELS = "deepseek-v4.1-flash,gemini-3.8-flash,llama-4-scout"

# Anti-abuse fences around the platform key. All optional; defaults shown.
TRIAL_REQUIRE_VERIFIED = "true"        # trial only for verified identities
TRIAL_MIN_ACCOUNT_AGE_MINUTES = "10"   # blocks instant sign-up-and-drain
TRIAL_IP_DAILY_MESSAGES = "30"         # per network, across all accounts
TRIAL_GLOBAL_DAILY_MESSAGES = "200"    # hard stop for the whole platform
TRIAL_MAX_OUTPUT_TOKENS = "700"        # caps cost per trial message

# PayPal billing (one-time payment -> plan for N days).
# Set PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET as Worker secrets.
PAYPAL_ENV = "live"
PAYPAL_CURRENCY = "USD"
PAYPAL_PRICE_PRO_USD = "20"
PAYPAL_PRICE_TEAM_USD = "50"
PAYPAL_PERIOD_DAYS = "30"

[assets]
directory = "./apps/web/out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/v1/*"]

[[d1_databases]]
binding = "DB"
database_name = "openagents-db"
database_id = "a018a756-cd11-44ba-b211-b5bc239a3762"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "openagents-avatars"
