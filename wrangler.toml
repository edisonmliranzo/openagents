name = "openagents"
main = "scripts/cf-worker.mjs"
compatibility_date = "2024-09-23"

# Free trial for the platform-owned key. This is a lifetime cap per account:
# it bounds inference spend while letting a new signup try the product before
# adding their own APIsRouter / BYOK key. Set PLATFORM_LLM_KEY as a secret;
# if it is empty the trial is disabled and BYOK-only behaviour is unchanged.
[vars]
TRIAL_MESSAGES = "15"
TRIAL_PROVIDER = "apisrouter"
TRIAL_MODEL = "deepseek-v4.1-flash"

[assets]
directory = "./apps/web/out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/v1/*"]

[[d1_databases]]
binding = "DB"
database_name = "openagents-db"
database_id = "a018a756-cd11-44ba-b211-b5bc239a3762"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "openagents-avatars"
